name: BDM review checks
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate source
        run: |
          python3 scripts/validate.py
          node --check app.js
  smoke:
    # This verifies the current published release, not unpromoted main changes.
    # Also runs on push because native Pages may not emit workflow_run events.
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Verify published site
        run: python3 scripts/smoke.py
