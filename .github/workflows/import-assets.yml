name: Import approved BDM assets
on:
  push:
    branches: [main]
    paths: ['.asset-import/**', '.github/workflows/import-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/import-assets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-bdm-performance.avif assets/logo-bdm-white.webp
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize checksum-verified BDM assets"
          git push origin HEAD:main
